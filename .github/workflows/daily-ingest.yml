name: Daily NAV Ingest

# 9:00 PM IST = 15:30 UTC
# Runs every day; AMFI publishes NAV after market close.
on:
  schedule:
    - cron: "30 15 * * *"
  workflow_dispatch: # allow manual trigger

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger daily NAV ingest
        run: |
          curl -sS -X POST \
            -H "X-Ingest-Secret: ${{ secrets.INGEST_SECRET }}" \
            -H "Content-Type: application/json" \
            https://sandy-fundlens.onrender.com/api/v1/ingest
        env:
          # Fail the job if the endpoint returns an error status
          CURL_FAIL_ON_ERROR: "1"
