name: CI/CD Production Deployment

on:
  push:
    branches:
      - main
      - master

jobs:
  lint-and-build:
    name: Build & Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend-node/package-lock.json'

      - name: Install Frontend Dependencies
        run: |
          cd frontend-node
          npm ci

      - name: Build Frontend Application
        run: |
          cd frontend-node
          npm run build

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend-fastapi/requirements.txt'

      - name: Install Backend Dependencies
        run: |
          cd backend-fastapi
          pip install -r requirements.txt

  deploy-vps:
    name: Deploy to Hostinger VPS
    needs: lint-and-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_VPS_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/fundlens
            git pull origin main
            
            # Backend dependencies & reload
            cd /var/www/fundlens/backend-fastapi
            source venv/bin/activate || python3 -m venv venv && source venv/bin/activate
            pip install -r requirements.txt
            
            # Frontend dependencies & build
            cd /var/www/fundlens/frontend-node
            npm ci
            npm run build
            
            # Restart PM2 Services
            cd /var/www/fundlens
            pm2 reload infrastructure/ecosystem.config.js --env production
            sudo systemctl reload nginx
