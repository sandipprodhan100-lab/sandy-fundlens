name: CI/CD Build & Cloudflare Validation

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build-and-validate:
    name: Build & Validate Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Frontend Dependencies
        working-directory: frontend-node
        run: npm install

      - name: Build Frontend (TanStack Start + Nitro SSR)
        working-directory: frontend-node
        env:
          VITE_SUPABASE_URL: "https://zjdrkfawfhgystldlpww.supabase.co"
          VITE_SUPABASE_PUBLISHABLE_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpqZHJrZmF3ZmhneXN0bGRscHd3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc4NTI4NjIsImV4cCI6MjEwMzQyODg2Mn0.5f-QK6dfgInsWe01YS7PpVscqWyBMcGvipYYHLZp7kk"
          SUPABASE_URL: "https://zjdrkfawfhgystldlpww.supabase.co"
          SUPABASE_PUBLISHABLE_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpqZHJrZmF3ZmhneXN0bGRscHd3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc4NTI4NjIsImV4cCI6MjEwMzQyODg2Mn0.5f-QK6dfgInsWe01YS7PpVscqWyBMcGvipYYHLZp7kk"
        run: npm run build

      - name: Deploy to Cloudflare Workers (if token configured)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        working-directory: frontend-node
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            npx wrangler deploy --config wrangler.jsonc
          else
            echo "CLOUDFLARE_API_TOKEN not configured in GitHub Secrets. Build & SSR validation succeeded! (Deploys are managed via local wrangler deploy)"
          fi
