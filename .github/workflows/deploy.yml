name: CI/CD Build & Cloudflare Validation

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build-and-validate:
    name: Build & Validate Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend-node/package-lock.json'

      - name: Install Frontend Dependencies
        run: |
          cd frontend-node
          npm ci

      - name: Build Frontend (TanStack Start + Nitro SSR)
        run: |
          cd frontend-node
          npm run build

      - name: Deploy to Cloudflare Workers (if token configured)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cd frontend-node
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            npx wrangler deploy --config wrangler.jsonc
          else
            echo "CLOUDFLARE_API_TOKEN not set in GitHub Secrets — build passed successfully. (Deploys are managed via local wrangler deploy)"
          fi
