name: Nightly NAV Ingest & S3 Snapshots Refresh

# Runs every night at 10:00 PM IST (16:30 UTC)
# AMFI publishes official NAV data after market close (~9 PM IST).
on:
  schedule:
    - cron: "30 16 * * *"
  workflow_dispatch: # Allow manual trigger from GitHub Actions tab

jobs:
  ingest-and-refresh:
    name: Ingest NAV & Refresh All S3 Snapshots
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ap-south-1
      AWS_S3_BUCKET: mutualfundlens-s3

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "frontend-node/package-lock.json"

      - name: Install Frontend Dependencies
        run: |
          cd frontend-node
          npm ci

      - name: Precompute & Refresh All 24 S3 Snapshots
        run: |
          cd frontend-node
          npx tsx scripts/precompute-snapshots.mts
