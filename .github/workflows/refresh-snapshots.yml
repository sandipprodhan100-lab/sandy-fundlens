name: Refresh Analysis Snapshots

on:
  schedule:
    # Run every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allow manual triggers

jobs:
  precompute:
    name: Pre-compute Analysis Snapshots
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ap-south-1
      AWS_S3_BUCKET: mutualfundlens-s3

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend-node/package-lock.json'

      - name: Install Dependencies
        run: |
          cd frontend-node
          npm ci

      - name: Run Snapshot Pre-computation
        run: |
          cd frontend-node
          npx tsx scripts/precompute-snapshots.mts
