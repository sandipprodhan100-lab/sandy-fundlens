# Production Nginx Configuration for Sandip Prodhan Portfolio & Fund Lens App

# Rate limiting zone for API requests
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

# Upstream definitions
upstream frontend_server {
    server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream backend_server {
    server 127.0.0.1:8000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# HTTP Redirection to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name sandipprodhan.in www.sandipprodhan.in fundlens.sandipprodhan.in;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Unified HTTPS Server Block (Domain Host Header Routing)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sandipprodhan.in www.sandipprodhan.in fundlens.sandipprodhan.in;

    # SSL Certificates (managed via Let's Encrypt Certbot)
    ssl_certificate /etc/letsencrypt/live/sandipprodhan.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sandipprodhan.in/privkey.pem;

    # Modern SSL Protocols and Ciphers
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 256;

    # Backend API Proxy (/api/v1/)
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://backend_server;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Frontend SSR Proxy (TanStack Start / Node)
    location / {
        proxy_pass http://frontend_server;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
